['📄 證件・金錢',['護照（全家人，確認效期）','電子機票／登機證（VJ845、9G510）','飯店訂單（皇冠假日、Emerald Bay）','樂園套票憑證／QR（Safari、VinWonders、泰迪熊）','纜車票、SPA 預約截圖','旅遊保險資料','少量越盾現金（餵動物飼料、小店、小費）','信用卡（確認海外手續費）','證件與訂單的雲端備份']],
['🔌 電子',['手機＋充電線','行動電源（只能手提，不能託運）','萬用轉接頭（保險起見）','耳機／平板（孩子飛行用）','防水相機或運動相機','網路：eSIM／漫遊／SIM 卡']],
['🧒 小孩用品',['泳衣、浮具／泳圈','水鞋／拖鞋','防曬帽、太陽眼鏡','備用衣服（玩水、出汗會用到）','濕紙巾、衛生紙、小塑膠袋','零食、水壺','兒童常備藥（依醫師指示）','玩具／繪本（飛機、車程用）','小風扇（Safari 很熱）']],
['☀️ 衣物・防護',['輕便雨衣／折疊傘（10 月雨季尾聲）','防曬乳','防蚊液','薄外套（機艙、冷氣房）','好走的鞋（動物園、樂園走很多）','泳衣多帶一套（泳池玩兩天）']],
['🧴 盥洗・藥品',['牙刷牙膏、洗面乳','個人常備藥','OK 繃、蚊蟲叮咬藥膏','酒精乾洗手','手提液體：每瓶 100 ml 以下，裝進透明夾鏈袋']],
['🛍 回程伴手禮',['折疊購物袋（KingKong Mart 用）','託運行李留空間（魚露、胡椒、Sim 酒要託運）','行李秤','塑膠袋／氣泡袋（包魚露防漏）']]];
let PK=ls.get('pq_pack')||{},PX=ls.get('pq_packx')||[];
function packv(){const all=PACK.map(g=>[g[0],g[1]]);if(PX.length)all.push(['✍ 自訂',PX]);let tot=0,dn=0;const h=all.map(g=>`<div class="card"><div class="pn">${g[0]}</div>${g[1].map(t=>{tot++;const d=PK[t];if(d)dn++;return `<label class="td ${d?'done':''}"><input type="checkbox" data-t="${t.replace(/"/g,'&quot;')}" ${d?'checked':''}><span>${t}</span></label>`}).join('')}</div>`).join('');return `<h2>行李清單 <span class="n">${dn}/${tot}</span></h2>`+h+`<div class="card"><div class="add"><input id="pi" placeholder="新增項目…"><button id="pb">加</button></div><div class="lk"><a href="#" id="pr">全部取消勾選</a></div></div>`}
function bindPack(){document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{PK[c.dataset.t]=c.checked;ls.set('pq_pack',PK);show('pack')});$('pb').onclick=()=>{const v=$('pi').value.trim();if(v){PX.push(v);ls.set('pq_packx',PX);show('pack')}};$('pr').onclick=e=>{e.preventDefault();PK={};ls.set('pq_pack',PK);show('pack')}}
// 地圖
const map=L.map('map',{scrollWheelZoom:false}).setView([10.2,103.98],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const M={},pos=ls.get('pq_pos')||{},fail=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ok=(a,b)=>a>9.8&&a<10.5&&b>103.8&&b<104.1;
async function geo(id){if(pos[id])return pos[id];for(const q of P[id].q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=vn&q='+encodeURIComponent(q));const j=await r.json();if(j[0]&&ok(+j[0].lat,+j[0].lon)){pos[id]=[+j[0].lat,+j[0].lon];ls.set('pq_pos',pos);return pos[id]}}catch(e){}await sleep(1100)}return null}
let cur='ov';
function ids(k){return typeof k==='string'?Object.keys(P):[...new Set(D[k].it.flatMap(r=>r.p||[]))]}
function refreshMap(){const show=ids(cur),pts=[];Object.keys(M).forEach(id=>{if(show.includes(id)){M[id].addTo(map);pts.push(M[id].getLatLng())}else map.removeLayer(M[id])});
 if(pts.length>1)map.fitBounds(L.latLngBounds(pts).pad(.25));else if(pts.length)map.setView(pts[0],13);
 const miss=show.filter(id=>fail.includes(id)).map(id=>P[id].n);$('mapst').textContent=miss.length?'未能自動定位：'+miss.join('、')+'（請用下方 Google 地圖連結）':(show.some(id=>!M[id])?'地圖定位中…':'')}
async function loadPins(){for(const id of Object.keys(P)){const c=await geo(id);if(c){M[id]=L.marker(c).bindTooltip(P[id].n,{permanent:false}).bindPopup(`<b>${P[id].n}</b><br><a target="_blank" href="${G(P[id].g)}">Google 地圖</a>`)}else fail.push(id);refreshMap();if(!pos[id])await sleep(1100)}refreshMap()}
function show(k){cur=k=(typeof k==='string'&&isNaN(k))?k:+k;const m=$('main');const V={ov:overview,todo:todo,fl:flights,fx:fxv,wx:wxv,eat:eatv,pack:packv};m.innerHTML=V[k]?V[k]():day(k);if(k==='todo')bindTodo();if(k==='pack')bindPack();if(k==='fx')bindFx();if(k==='wx')fillWx();fillChips();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==String(k)));refreshMap();if(k!=='todo'&&k!=='pack')window.scrollTo(0,0)}
$('nav').innerHTML=[['ov','總覽'],...D.map((d,i)=>[i,d.k+' '+d.d.split(' ')[0]]),['fl','✈ 航班'],['wx','☀ 天氣'],['fx','💱 匯率'],['eat','🍜 吃買'],['pack','🧳 行李'],['todo','☑ 待辦']].map(a=>`<button data-k="${a[0]}" onclick="show('${a[0]}')">${a[1]}</button>`).join('');
show('ov');renderBar();loadPins();loadWx();loadFx();
</script></body></html>
